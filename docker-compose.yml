version: "3.8"

services:
  db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_DB: eqip
      POSTGRES_USER: eqip
      POSTGRES_PASSWORD: eqip_dev_password
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  backend:
    build: ./backend
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: "******db:5432/eqip"
      LLM_API_BASE_URL: "${LLM_API_BASE_URL:-http://localhost:11434/v1}"
      LLM_API_KEY: "${LLM_API_KEY:-}"
      LLM_MODEL_NAME: "${LLM_MODEL_NAME:-qwen3}"
      EMBEDDING_API_BASE_URL: "${EMBEDDING_API_BASE_URL:-http://localhost:11434/v1}"
      EMBEDDING_API_KEY: "${EMBEDDING_API_KEY:-}"
      EMBEDDING_MODEL_NAME: "${EMBEDDING_MODEL_NAME:-bge-m3}"
      EMBEDDING_DIMENSIONS: "${EMBEDDING_DIMENSIONS:-1024}"
    depends_on:
      - db

  frontend:
    build: ./frontend
    ports:
      - "5173:5173"
    environment:
      VITE_API_URL: "http://localhost:8000/api"
    depends_on:
      - backend

volumes:
  pgdata:
