version: "3.8"

services:
  db:
    image: postgres:16
    environment:
      POSTGRES_DB: eqip
      POSTGRES_USER: eqip
      POSTGRES_PASSWORD: eqip_dev_password
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  backend:
    build: ./backend
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: "******db:5432/eqip"
    depends_on:
      - db

  frontend:
    build: ./frontend
    ports:
      - "5173:5173"
    environment:
      VITE_API_URL: "http://localhost:8000/api"
    depends_on:
      - backend

volumes:
  pgdata:
